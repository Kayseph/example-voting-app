apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: example-voting-app-vote:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: vote
              containerPort: 8080
