apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voting-app.name" (dict "name" "db") }}
  labels:
    app: db
spec:
  replicas: {{ .Values.postgres.replicaCount }}
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "voting-app.name" (dict "name" "db") }}
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
    - name: db-service
      port: {{ .Values.postgres.servicePort }}
      targetPort: 5432
