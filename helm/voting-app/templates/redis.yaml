apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voting-app.name" (dict "name" "redis") }}
  labels:
    app: redis
spec:
  replicas: {{ .Values.redis.replicaCount }}
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "voting-app.name" (dict "name" "redis") }}
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis-service
      port: {{ .Values.redis.servicePort }}
      targetPort: 6379
