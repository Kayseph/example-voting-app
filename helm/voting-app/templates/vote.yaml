apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voting-app.name" (dict "name" "vote") }}
  labels:
    app: vote
spec:
  replicas: {{ .Values.vote.replicaCount }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
        - name: vote
          image: {{ .Values.vote.image | quote }}
          imagePullPolicy: {{ .Values.vote.imagePullPolicy }}
          ports:
            - name: vote
              containerPort: {{ .Values.vote.containerPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "voting-app.name" (dict "name" "vote") }}
spec:
  type: {{ .Values.vote.service.type }}
  selector:
    app: vote
  ports:
    - name: vote-service
      port: {{ .Values.vote.service.port }}
      targetPort: {{ .Values.vote.containerPort }}
      nodePort: {{ .Values.vote.service.nodePort }}
