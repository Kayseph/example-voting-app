apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voting-app.name" (dict "name" "worker") }}
  labels:
    app: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: {{ .Values.worker.image | quote }}
          imagePullPolicy: {{ .Values.worker.imagePullPolicy }}
